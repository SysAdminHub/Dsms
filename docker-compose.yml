services:
  db:
    image: mysql:8.0
    container_name: dsms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dsms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  dsms-web:
    build:
      context: .
      dockerfile: Dsms.Web/Dockerfile
    image: ${DSMS_WEB_IMAGE:-dsms-web:latest}
    container_name: dsms-web-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;
      Storage__UploadPath: ${STORAGE_UPLOAD_PATH:-/app/Data/Uploads}
      DataProtection__ApplicationName: ${DATA_PROTECTION_APPLICATION_NAME:-DatenschutzCloud}
      DataProtection__KeysPath: /app/DataProtection-Keys
    ports:
      - "${DSMS_WEB_HTTP_PORT:-8081}:8080"
    volumes:
      - dsms_uploads:/app/Data/Uploads
      - dsms_dataprotection:/app/DataProtection-Keys

  dsms-provisioning:
    build:
      context: .
      dockerfile: Dsms.Provisioning/Dockerfile
    image: ${DSMS_PROVISIONING_IMAGE:-dsms-provisioning:latest}
    container_name: dsms-provisioning-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: Server=db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;
      Database__RunMigrationsOnStartup: ${PROVISIONING_RUN_MIGRATIONS_ON_STARTUP:-false}
      DataProtection__ApplicationName: ${DATA_PROTECTION_APPLICATION_NAME:-DatenschutzCloud}
      DataProtection__KeysPath: /app/DataProtection-Keys
      AppUrls__MainAppBaseUrl: ${APP_BASE_URL}
      AppUrls__ProvisioningAppBaseUrl: ${PROVISIONING_BASE_URL}
      Features__PublicSignupEnabled: ${PROVISIONING_PUBLIC_SIGNUP_ENABLED:-true}
      ProvisioningEmail__UseDatabaseSettings: ${PROVISIONING_EMAIL_USE_DATABASE_SETTINGS:-false}
      ProvisioningEmail__Enabled: ${PROVISIONING_EMAIL_ENABLED:-true}
      ProvisioningEmail__SmtpHost: ${PROVISIONING_EMAIL_SMTP_HOST}
      ProvisioningEmail__SmtpPort: ${PROVISIONING_EMAIL_SMTP_PORT:-587}
      ProvisioningEmail__Encryption: ${PROVISIONING_EMAIL_ENCRYPTION:-StartTls}
      ProvisioningEmail__SmtpUsername: ${PROVISIONING_EMAIL_SMTP_USERNAME}
      ProvisioningEmail__SmtpPassword: ${PROVISIONING_EMAIL_SMTP_PASSWORD}
      ProvisioningEmail__SenderEmail: ${PROVISIONING_EMAIL_SENDER_EMAIL}
      ProvisioningEmail__SenderName: ${PROVISIONING_EMAIL_SENDER_NAME}
      ProvisioningEmail__TimeoutSeconds: ${PROVISIONING_EMAIL_TIMEOUT_SECONDS:-30}
    ports:
      - "${DSMS_PROVISIONING_HTTP_PORT:-8082}:8080"
    volumes:
      - dsms_dataprotection:/app/DataProtection-Keys

volumes:
  dsms_mysql_data:
  dsms_uploads:
  dsms_dataprotection:
